name: Offline reliability evidence

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the declared dependency set
        run: python -m pip install -r requirements-dev.txt
      - name: Audit the installed environment
        run: python -m pip_audit --strict --cache-dir "$RUNNER_TEMP/audit-cache" --format json --output "$RUNNER_TEMP/security-audit.json"
      - name: Static checks and contract baseline
        run: |
          python scripts/check_publication.py
          ruff check --no-cache src config scripts tests/offline tests/fixtures conftest.py
          mypy --cache-dir "$RUNNER_TEMP/mypy" src config
          python scripts/check_contracts.py
      - name: Run offline acceptance checks
        run: python scripts/run_offline.py --output "$RUNNER_TEMP/offline-evidence"
      - name: Check seeded client defects
        run: python scripts/mutation_check.py --output "$RUNNER_TEMP/mutation-evidence"
      - name: Build run history and evaluate recorded synthetic responses
        run: |
          python scripts/build_history_report.py "$RUNNER_TEMP"/offline-evidence/results-*.jsonl --output "$RUNNER_TEMP/history-evidence"
          python scripts/evaluate_responses.py --config fixtures/evaluation/config.json --input fixtures/evaluation/synthetic_responses.jsonl --output "$RUNNER_TEMP/response-evidence"
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/offline-evidence
            ${{ runner.temp }}/mutation-evidence
            ${{ runner.temp }}/security-audit.json
            ${{ runner.temp }}/history-evidence
            ${{ runner.temp }}/response-evidence
          if-no-files-found: error
          include-hidden-files: true
